[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-auto-clone"
version = "1.0.0"
description = "AI-powered GitHub feature extraction and packaging tool. Search repos, analyze codebases, extract features, and package them into importable folders."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "github-auto-clone contributors"},
]
keywords = ["github", "ai", "feature-extraction", "code-packaging", "graph-rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "ollama>=0.4.0",
    "gitpython>=3.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.0.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
ghclone = "github_auto_clone.cli:app"
ghclone-web = "github_auto_clone.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_auto_clone"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build.targets.sdist]
include = ["src/github_auto_clone"]

[tool.hatch.build]
artifacts = ["src/github_auto_clone/templates/**"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
